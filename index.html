<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
  }
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: "Source Code Pro", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    color: #e6e6e6;
    text-align: center;
    padding: 1.5rem;
  }
  main {
    max-width: 32rem;
  }
  h1 {
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    font-weight: 600;
    margin: 0 0 0.75rem;
    letter-spacing: -0.02em;
  }
  p {
    font-size: 1rem;
    line-height: 1.6;
    color: #a3a3a3;
    margin: 0 0 2rem;
  }
  a.resume-link {
    display: inline-block;
    font-family: inherit;
    font-size: 0.95rem;
    color: #0d0d0d;
    background: #e6e6e6;
    text-decoration: none;
    padding: 0.75rem 1.5rem;
    border-radius: 4px;
    transition: opacity 0.15s ease;
  }
  a.resume-link:hover {
    opacity: 0.85;
  }
</style>
</head>
<body>
<main>
  <h1>Coming soon.</h1>
  <p>This site is under construction. In the meantime, here's my resume.</p>
  <a class="resume-link" href="assets/resume.pdf" target="_blank" rel="noopener">View Resume (PDF)</a>
